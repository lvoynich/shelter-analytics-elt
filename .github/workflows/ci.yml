name: Data Pipeline CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-parse:
    name: Lint Python & SQL + Parse dbt DAG
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies and linters
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff sqlfluff

      - name: Lint Python ingestion code (Ruff)
        run: ruff check src/

      - name: Parse dbt project and validate DAG
        run: dbt parse --project-dir shelter_warehouse --profiles-dir shelter_warehouse/ci

      - name: Lint SQL models and tests (SQLFluff)
        run: sqlfluff lint shelter_warehouse/models shelter_warehouse/tests
